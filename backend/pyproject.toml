[tool.poetry]
name = "user-management-api"
version = "0.1.0"
description = "Multi-Tenant User Service API"
authors = ["Development Team <dev@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = "^0.30.6"
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
email-validator = "^2.1.1"
websockets = "^14.0.0"
supabase = "^2.28.3"
pyjwt = "^2.10.1"
sqlalchemy = "^2.0.5"
alembic = "^1.13.1"
asyncpg = "^0.30.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^4.1.0"
httpx = "^0.27.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
pythonpath = ["."]
include = ["."]
extraPaths = ["."]
executionEnvironments = [
  { root = ".", pythonpath = ["."], extraPaths = ["."] }
]

[tool.pytest.ini_options]
pythonpath = ["."]