version: "3.8"

services:
  backend:
    build: .
    container_name: user-management-backend
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    env_file:
      - .env
    environment:
      - PORT=8080
      - SUPABASE_URL=http://host.docker.internal:8000
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8080 --reload
    # Use host.docker.internal to allow reaching the supabase stack if it is run locally
    extra_hosts:
      - "host.docker.internal:host-gateway"
