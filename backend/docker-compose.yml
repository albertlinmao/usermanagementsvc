version: "3.8"

services:
  backend:
    build: .
    container_name: user-management-backend
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    env_file:
      - .env
    environment:
      - PORT=8080
      - SUPABASE_URL=http://supabase-kong:8000
      - PYTHONPATH=src
      - DATABASE_URL=postgresql+asyncpg://postgres:d27096746169f71e6c16998af5dc5322c14c28a2@supabase-db:5432/postgres
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8080 --reload
    networks:
      - supabase_default

networks:
  supabase_default:
    external: true
